# Baut die Hilfe-Website (docs/) und lädt sie auf den Webspace (world4you) hoch.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   DOCS_FTP_HOST      z. B. ftp.greenresorts.hr (bzw. Server laut world4you)
#   DOCS_FTP_USER      FTP-/SFTP-Benutzer
#   DOCS_FTP_PASSWORD  Passwort
#   DOCS_FTP_DIR       Zielordner auf dem Webspace, z. B. /hilfe
#   DOCS_FTP_PROTOCOL  optional: ftps (Standard) oder sftp
# Ohne Secrets wird nur gebaut und die Website als Artefakt bereitgestellt.
name: Hilfe-Website
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
concurrency: { group: docs-deploy, cancel-in-progress: true }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Werkzeuge installieren
        run: pip install "mkdocs-material>=9.5,<10" "mkdocs-static-i18n>=1.2,<2"
      - name: Website bauen
        env: { NO_MKDOCS_2_WARNING: '1' }
        run: ./docs/build-docs.sh
      - uses: actions/upload-artifact@v5
        with: { name: hilfe-website, path: docs/site, retention-days: 14 }
      - name: Auf Webspace hochladen
        env:
          HOST: ${{ secrets.DOCS_FTP_HOST }}
          USER: ${{ secrets.DOCS_FTP_USER }}
          PASS: ${{ secrets.DOCS_FTP_PASSWORD }}
          DIR: ${{ secrets.DOCS_FTP_DIR }}
          PROTO: ${{ secrets.DOCS_FTP_PROTOCOL }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ] || [ -z "$DIR" ]; then
            echo "::notice::Keine Zugangsdaten hinterlegt – Website nur gebaut (Artefakt hilfe-website)."
            exit 0
          fi
          sudo apt-get install -y -qq lftp >/dev/null
          PROTO="${PROTO:-ftps}"
          if [ "$PROTO" = "sftp" ]; then URL="sftp://$HOST"; SET="set sftp:auto-confirm yes;"; else URL="ftp://$HOST"; SET="set ftp:ssl-force true; set ftp:ssl-protect-data true;"; fi
          # .htaccess/.htpasswd (z. B. Verzeichnisschutz für /verwaltung aus dem world4you-Kundenbereich) werden nie überschrieben oder gelöscht
          # Passwort über Umgebungsvariable (sicher bei Sonderzeichen wie , @ : im Passwort)
          export LFTP_PASSWORD="$PASS"
          lftp --env-password -u "$USER" "$URL" -e "$SET set net:max-retries 3; mirror -R --delete --verbose=1 --exclude-glob .ht* --exclude-glob '*/.ht*' docs/site/ $DIR; quit"
      - name: Website prüfen
        if: always()
        env:
          SITE: ${{ vars.DOCS_SITE_URL || 'https://helpdolibarr.greenresorts.hr' }}
        run: |
          fail=0
          for p in / verwaltung/ verwaltung/hr/ verwaltung/vorschreibung/ eigentuemer/ eigentuemer/de/ eigentuemer/en/ eigentuemer/sl/ eigentuemer/uk/ eigentuemer/de/zaduzenje/ eigentuemer/assets/stylesheets/extra.css verwaltung/news/2026-11-zuoz/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE%/}/$p" || echo 000)
            echo "$code  ${SITE%/}/$p"
            [ "$code" = "200" ] || [ "$code" = "401" ] || fail=1
          done
          [ $fail -eq 0 ] || echo "::warning::Nicht alle Seiten erreichbar (401 = Verzeichnisschutz, ok)."
