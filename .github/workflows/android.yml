# Baut die Android-App „Ideenbox“ (APK als Artefakt).
# Optional für gleichbleibende Signatur (Updates ohne Neuinstallation) Repository-Secrets:
#   IDEENBOX_KEYSTORE_BASE64  Keystore (base64)   IDEENBOX_KEYSTORE_PASSWORD  Passwort   IDEENBOX_KEY_ALIAS  Alias (Standard ideenbox)
name: Android-App Ideenbox
on:
  push:
    branches: [main]
    paths: ['app-ideenbox/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-ideenbox } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Signaturschlüssel
        env: { KS: '${{ secrets.IDEENBOX_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/ideenbox.jks"; echo "IDEENBOX_KEYSTORE=$RUNNER_TEMP/ideenbox.jks" >> "$GITHUB_ENV"; fi
      - name: Tests und APK
        env:
          IDEENBOX_KEYSTORE_PASSWORD: ${{ secrets.IDEENBOX_KEYSTORE_PASSWORD }}
          IDEENBOX_KEY_ALIAS: ${{ secrets.IDEENBOX_KEY_ALIAS }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v5
        with: { name: ideenbox-apk, path: app-ideenbox/app/build/outputs/apk/release/*.apk, retention-days: 30 }
